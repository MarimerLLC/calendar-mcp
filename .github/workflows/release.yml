name: Build and Release

on:
  push:
    branches:
      - release
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cross-platform:
    name: Build Cross-Platform Packages
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependencies
        run: dotnet restore adjutant.slnx

      - name: Build solution
        run: dotnet build adjutant.slnx --configuration Release --no-restore
      
      - name: Publish Windows (win-x64)
        run: |
          dotnet publish src/Adjutant.Cli/Adjutant.Cli.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            --output ./publish/win-x64/cli \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true
          
          dotnet publish src/Adjutant.StdioServer/Adjutant.StdioServer.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            --output ./publish/win-x64/server \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true
      
      - name: Publish Linux (linux-x64)
        run: |
          dotnet publish src/Adjutant.Cli/Adjutant.Cli.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output ./publish/linux-x64/cli \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true
          
          dotnet publish src/Adjutant.StdioServer/Adjutant.StdioServer.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output ./publish/linux-x64/server \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true
      
      - name: Publish macOS (osx-x64)
        run: |
          dotnet publish src/Adjutant.Cli/Adjutant.Cli.csproj \
            --configuration Release \
            --runtime osx-x64 \
            --self-contained true \
            --output ./publish/osx-x64/cli \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true
          
          dotnet publish src/Adjutant.StdioServer/Adjutant.StdioServer.csproj \
            --configuration Release \
            --runtime osx-x64 \
            --self-contained true \
            --output ./publish/osx-x64/server \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true
      
      - name: Publish macOS (osx-arm64)
        run: |
          dotnet publish src/Adjutant.Cli/Adjutant.Cli.csproj \
            --configuration Release \
            --runtime osx-arm64 \
            --self-contained true \
            --output ./publish/osx-arm64/cli \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true
          
          dotnet publish src/Adjutant.StdioServer/Adjutant.StdioServer.csproj \
            --configuration Release \
            --runtime osx-arm64 \
            --self-contained true \
            --output ./publish/osx-arm64/server \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true
      
      - name: Organize release files (Windows)
        run: |
          mkdir -p ./release/adjutant-win-x64
          cp -r ./publish/win-x64/cli/* ./release/adjutant-win-x64/
          cp -r ./publish/win-x64/server/* ./release/adjutant-win-x64/
          cp README.md ./release/adjutant-win-x64/
          cp LICENSE ./release/adjutant-win-x64/
      
      - name: Organize release files (Linux)
        run: |
          mkdir -p ./release/adjutant-linux-x64
          cp -r ./publish/linux-x64/cli/* ./release/adjutant-linux-x64/
          cp -r ./publish/linux-x64/server/* ./release/adjutant-linux-x64/
          cp README.md ./release/adjutant-linux-x64/
          cp LICENSE ./release/adjutant-linux-x64/
          chmod +x ./release/adjutant-linux-x64/Adjutant.Cli
          chmod +x ./release/adjutant-linux-x64/Adjutant.StdioServer
      
      - name: Organize release files (macOS x64)
        run: |
          mkdir -p ./release/adjutant-osx-x64
          cp -r ./publish/osx-x64/cli/* ./release/adjutant-osx-x64/
          cp -r ./publish/osx-x64/server/* ./release/adjutant-osx-x64/
          cp README.md ./release/adjutant-osx-x64/
          cp LICENSE ./release/adjutant-osx-x64/
          chmod +x ./release/adjutant-osx-x64/Adjutant.Cli
          chmod +x ./release/adjutant-osx-x64/Adjutant.StdioServer
      
      - name: Organize release files (macOS ARM64)
        run: |
          mkdir -p ./release/adjutant-osx-arm64
          cp -r ./publish/osx-arm64/cli/* ./release/adjutant-osx-arm64/
          cp -r ./publish/osx-arm64/server/* ./release/adjutant-osx-arm64/
          cp README.md ./release/adjutant-osx-arm64/
          cp LICENSE ./release/adjutant-osx-arm64/
          chmod +x ./release/adjutant-osx-arm64/Adjutant.Cli
          chmod +x ./release/adjutant-osx-arm64/Adjutant.StdioServer
      
      - name: Create zip archives
        run: |
          cd ./release
          zip -r adjutant-win-x64.zip adjutant-win-x64
          tar -czf adjutant-linux-x64.tar.gz adjutant-linux-x64
          tar -czf adjutant-osx-x64.tar.gz adjutant-osx-x64
          tar -czf adjutant-osx-arm64.tar.gz adjutant-osx-arm64
          cd ..
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: adjutant-win-x64
          path: ./release/adjutant-win-x64.zip
      
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: adjutant-linux-x64
          path: ./release/adjutant-linux-x64.tar.gz
      
      - name: Upload macOS x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: adjutant-osx-x64
          path: ./release/adjutant-osx-x64.tar.gz
      
      - name: Upload macOS ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: adjutant-osx-arm64
          path: ./release/adjutant-osx-arm64.tar.gz
  
  build-windows-installer:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: build-cross-platform
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: adjutant-win-x64
          path: ./artifacts
      
      - name: Extract Windows artifact
        run: |
          Expand-Archive -Path ./artifacts/adjutant-win-x64.zip -DestinationPath ./release
        shell: pwsh
      
      - name: Install Inno Setup
        run: |
          choco install innosetup -y
        shell: pwsh
      
      - name: Build Installer
        run: |
          # Comment out the icon line if icon doesn't exist
          if (-not (Test-Path "installer\adjutant-icon.ico")) {
            (Get-Content installer\Adjutant-Setup.iss) -replace '^SetupIconFile=', ';SetupIconFile=' | Set-Content installer\Adjutant-Setup.iss
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Adjutant-Setup.iss
        shell: pwsh
      
      - name: Upload Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: adjutant-setup-win-x64
          path: ./release/adjutant-setup-win-x64.exe
  
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-cross-platform, build-windows-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: Display structure of downloaded files
        run: ls -R ./artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/adjutant-win-x64/adjutant-win-x64.zip
            ./artifacts/adjutant-linux-x64/adjutant-linux-x64.tar.gz
            ./artifacts/adjutant-osx-x64/adjutant-osx-x64.tar.gz
            ./artifacts/adjutant-osx-arm64/adjutant-osx-arm64.tar.gz
            ./artifacts/adjutant-setup-win-x64/adjutant-setup-win-x64.exe
          draft: false
          prerelease: false
          generate_release_notes: true
