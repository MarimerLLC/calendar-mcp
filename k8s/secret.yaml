# Calendar MCP secrets - EDIT BEFORE APPLYING
# Generate values:
#   Admin token: openssl rand -hex 32
#   MCP API key: openssl rand -hex 32   (optional - see below)
#
# Then base64 encode for this file:
#   echo -n "your-admin-token" | base64
apiVersion: v1
kind: Secret
metadata:
  name: calendar-mcp-secrets
  namespace: calendar-mcp
  labels:
    app: calendar-mcp
type: Opaque
data:
  # Replace with base64-encoded value
  admin-token: Y2hhbmdlbWU=
  # Optional. Omit this key (and the matching env var in deployment.yaml) to let the server
  # generate an MCP API key on first start and log it:
  #   kubectl logs -n calendar-mcp deploy/calendar-mcp | grep "MCP API key"
  # Set it here instead to control the key from the deployment, so it is not stored on the PVC.
  # mcp-api-key: Y2hhbmdlbWU=
