# Adjutant HTTP Server - Kubernetes Deployment
# All resources here are pinned to the adjutant namespace, so these commands
# do not depend on the namespace your kubectl context happens to default to.
# Prerequisites:
#   0. Create the namespace: kubectl create namespace adjutant
#   1. Create the secret: kubectl apply -f secret.yaml
#   2. Create the PVC: kubectl apply -f pvc.yaml
#   3. Deploy: kubectl apply -f deployment.yaml
#   4. Access via port-forward: kubectl port-forward -n adjutant svc/adjutant 8080:8080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adjutant
  namespace: adjutant
  labels:
    app: adjutant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: adjutant
  template:
    metadata:
      labels:
        app: adjutant
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: adjutant
          image: docker.io/rockylhotka/adjutant:2.0.0
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ADJUTANT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: adjutant-secrets
                  key: admin-token
            # Optional: supply the MCP endpoint API key from the Secret rather than letting the
            # server generate one onto the PVC at first start. Uncomment together with the
            # mcp-api-key entry in secret.yaml.
            # - name: ADJUTANT_MCP_KEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: adjutant-secrets
            #       key: mcp-api-key
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.loki.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "adjutant"
          volumeMounts:
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: adjutant-data
---
apiVersion: v1
kind: Service
metadata:
  name: adjutant
  namespace: adjutant
  labels:
    app: adjutant
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: adjutant
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adjutant-tailscale
  namespace: adjutant
  annotations:
    tailscale.com/hostname: adjutant
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - adjutant.tail920062.ts.net
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adjutant
                port:
                  number: 8080
